<style>
  :root {
    --ground: #F2F3EF;
    --surface: #FFFFFF;
    --ink: #1E241F;
    --muted: #6B736B;
    --faint: #9AA29A;
    --line: #DEE1DA;
    --accent: #2F6B57;
    --accent-soft: #E4EDE8;
    --meal-1: #7A8FA6;
    --meal-2: #B7642F;
    --meal-3: #5A4A6B;
    --serif: "Gowun Batang", "Nanum Myeongjo", serif;
    --sans: "IBM Plex Sans KR", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141714;
      --surface: #1C201C;
      --ink: #E8EBE5;
      --muted: #99A199;
      --faint: #6E766E;
      --line: #2E332E;
      --accent: #74C2A2;
      --accent-soft: #1F2E28;
      --meal-1: #8FA6BC;
      --meal-2: #D0834F;
      --meal-3: #8E7CA6;
    }
  }
  :root[data-theme="dark"] {
    --ground: #141714;
    --surface: #1C201C;
    --ink: #E8EBE5;
    --muted: #99A199;
    --faint: #6E766E;
    --line: #2E332E;
    --accent: #74C2A2;
    --accent-soft: #1F2E28;
    --meal-1: #8FA6BC;
    --meal-2: #D0834F;
    --meal-3: #8E7CA6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }

  .wrap {
    max-width: 460px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ---- 머리말: 한 줄로 압축 ---- */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .top h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.1;
    margin: 0;
    letter-spacing: -.01em;
  }
  .top .site {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .08em;
    color: var(--faint);
    white-space: nowrap;
  }

  /* ---- 요일 ---- */
  .days {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    user-select: none;
  }
  .day {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    cursor: pointer;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 0 5px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .day b { font-family: var(--serif); font-size: 15px; font-weight: 700; line-height: 1; }
  .day span {
    font-family: var(--mono);
    font-size: 9.5px;
    font-variant-numeric: tabular-nums;
  }
  .day[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--ground);
  }
  .day.today:not([aria-pressed="true"]) { border-color: var(--accent); color: var(--accent); }
  .day:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- 끼니 탭 ---- */
  .meals {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-bottom: 1px solid var(--line);
    user-select: none;
  }
  .tab {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    cursor: pointer;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 5px 0 7px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: var(--faint);
  }
  .tab b {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 700;
    line-height: 1.1;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tab small {
    font-family: var(--mono);
    font-size: 9.5px;
    font-variant-numeric: tabular-nums;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--rail, var(--ink)); }
  .tab[data-meal="조식"] { --rail: var(--meal-1); }
  .tab[data-meal="중식"] { --rail: var(--meal-2); }
  .tab[data-meal="석식"] { --rail: var(--meal-3); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  /* ---- 배식 상태 ---- */
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-height: 16px;
  }
  .status.live { color: var(--accent); }
  .status .bar {
    flex: 1;
    height: 2px;
    background: var(--line);
    border-radius: 1px;
    overflow: hidden;
  }
  .status .bar > i { display: block; height: 100%; background: var(--accent); }

  /* ---- 메뉴 ---- */
  main { flex: 1; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
  }
  .grid.single { grid-template-columns: 1fr; }
  .col { min-width: 0; }
  .col-name {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 3px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 2px 0; color: var(--muted); font-size: 14.5px; }
  li.main {
    color: var(--ink);
    font-size: 17.5px;
    font-weight: 600;
    line-height: 1.3;
    padding-bottom: 3px;
    word-break: keep-all;
  }
  .grid.single li { font-size: 15.5px; }
  .grid.single li.main { font-size: 20px; }

  .extras {
    grid-column: 1 / -1;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .extra { font-size: 13.5px; color: var(--muted); }
  .extra b {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--faint);
    font-weight: 500;
    margin-right: 6px;
  }

  /* ---- 전체 보기 ---- */
  .all-meal + .all-meal { margin-top: 14px; }
  .all-head {
    display: flex;
    align-items: baseline;
    gap: 7px;
    margin-bottom: 5px;
  }
  .all-head h2 {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: var(--rail);
  }
  .all-meal[data-meal="조식"] { --rail: var(--meal-1); }
  .all-meal[data-meal="중식"] { --rail: var(--meal-2); }
  .all-meal[data-meal="석식"] { --rail: var(--meal-3); }
  .all-head small { font-family: var(--mono); font-size: 10px; color: var(--faint); }

  /* ---- 꼬리말 ---- */
  details {
    font-size: 11.5px;
    color: var(--faint);
    border-top: 1px solid var(--line);
    padding-top: 9px;
  }
  summary {
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .07em;
    color: var(--muted);
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "＋ "; }
  details[open] summary::before { content: "－ "; }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  details p { margin: 7px 0 0; line-height: 1.45; word-break: break-all; }
  details p.takeout { color: var(--muted); }
  .stale {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--meal-2);
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

    return day.meals.filter(function (m) { return m.name === name; })[0];
  }

  /* 한 끼니를 2열(A/B코너) 또는 1열로 그린다 */
  function mealGrid(meal, compact) {
    var cols = meal.corners.filter(function (c) {
      return !c.name || COLUMNS.indexOf(c.name) >= 0;
    });
    var extras = meal.corners.filter(function (c) {
      return c.name && COLUMNS.indexOf(c.name) < 0;
    });

    var grid = el("div", "grid" + (cols.length < 2 ? " single" : ""));
    cols.forEach(function (c) {
      var box = el("div", "col");
      if (c.name) box.appendChild(el("div", "col-name", c.name));
      var ul = el("ul");
      c.items.forEach(function (item, i) {
        ul.appendChild(el("li", i === 0 && !compact ? "main" : null, item));
      });
      box.appendChild(ul);
      grid.appendChild(box);
    });

    if (extras.length) {
      var wrap = el("div", "extras");
      extras.forEach(function (c) {
        var row = el("div", "extra");
        row.appendChild(el("b", null, c.name));
        row.appendChild(document.createTextNode(c.items.join(" · ")));
        wrap.appendChild(row);
      });
      grid.appendChild(wrap);
    }
    return grid;
  }

  function renderStatus(day, isToday) {
    var box = $("status");
    box.textContent = "";
    box.className = "status";
    if (!isToday) {
      box.appendChild(document.createTextNode(day.label + " " + day.weekday + "요일"));
      return;
    }
    var live = liveMeal(day), m = nowMin();
    if (live) {
      var s = span(mealOf(day, live));
      var left = s.to - m;
      box.className = "status live";
      box.appendChild(document.createTextNode(live + " 배식중"));
      var bar = el("div", "bar");
      var fill = el("i");
      fill.style.width = ((m - s.from) / (s.to - s.from) * 100).toFixed(1) + "%";
      bar.appendChild(fill);
      box.appendChild(bar);
      box.appendChild(document.createTextNode(
        (left >= 60 ? Math.floor(left / 60) + "시간 " : "") + (left % 60) + "분 남음"));
      return;
    }
    var next = null;
    day.meals.forEach(function (meal) {
      var sp = span(meal);
      if (sp && m < sp.from && !next) next = { name: meal.name, at: sp.from_ };
    });
    box.appendChild(document.createTextNode(
      next ? "다음 배식 " + next.name + " " + next.at : "오늘 배식 종료"));
  }

  function renderTabs(day, isToday) {
    var bar = $("tabs");
    bar.textContent = "";
    var live = isToday ? liveMeal(day) : null;

    day.meals.forEach(function (meal) {
      var t = el("button", "tab");
      t.type = "button";
      t.setAttribute("role", "tab");
      t.setAttribute("data-meal", meal.name);
      t.setAttribute("aria-selected", meal.name === state.meal ? "true" : "false");
      var b = el("b");
      b.appendChild(document.createTextNode(meal.name));
      if (meal.name === live) b.appendChild(el("span", "dot"));
      t.appendChild(b);
      var s = span(meal);
      t.appendChild(el("small", null, s ? s.from_ : ""));
      t.addEventListener("click", function () {
        state.meal = meal.name;
        state.pinned = true;
        draw();
      });
      bar.appendChild(t);
    });

    var all = el("button", "tab");
    all.type = "button";
    all.setAttribute("role", "tab");
    all.setAttribute("aria-selected", state.meal === "전체" ? "true" : "false");
    all.appendChild(el("b", null, "전체"));
    all.appendChild(el("small", null, "하루"));
    all.addEventListener("click", function () {
      state.meal = "전체";
      state.pinned = true;
      draw();
    });
    bar.appendChild(all);
  }

  function draw() {
    var day = WEEK.days[state.day];
    var isToday = state.day === state.today;

    if (!state.pinned) state.meal = defaultMeal(day, isToday);
    if (state.meal !== "전체" && !mealOf(day, state.meal)) state.meal = day.meals[0].name;

    Array.prototype.forEach.call($("days").children, function (b, i) {
      b.setAttribute("aria-pressed", i === state.day ? "true" : "false");
    });
    renderTabs(day, isToday);
    renderStatus(day, isToday);

    var root = $("menu");
    root.textContent = "";
    if (state.meal === "전체") {
      day.meals.forEach(function (meal) {
        var sec = el("section", "all-meal");
        sec.setAttribute("data-meal", meal.name);
        var head = el("div", "all-head");
        head.appendChild(el("h2", null, meal.name));
        head.appendChild(el("small", null, meal.time));
        sec.appendChild(head);
        sec.appendChild(mealGrid(meal, true));
        root.appendChild(sec);
      });
    } else {
      root.appendChild(mealGrid(mealOf(day, state.meal), false));
    }
  }

  function boot() {
    $("title").textContent = WEEK.title.replace(/\).*$/, "").trim() + " 식단";
    $("site").textContent = WEEK.site;

    var body = $("info-body");
    if (WEEK.takeout) {
      var p = el("p", "takeout", "Take Out · " + WEEK.takeout);
      body.appendChild(p);
    }
    (WEEK.origin || []).forEach(function (line) { body.appendChild(el("p", null, line)); });
    body.appendChild(el("p", null, "출처 " + WEEK.source + " · pvv.co.kr 게시판 최신 첨부"));

    var d = new Date();
    var iso = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    state.today = WEEK.days.map(function (x) { return x.date; }).indexOf(iso);
    state.day = state.today >= 0 ? state.today : 0;

    if (state.today < 0) {
      var note = el("p", "stale", "오늘(" + iso + ")은 이 주간표에 없습니다. 새 표가 올라왔는지 확인하세요.");
      $("menu").before(note);
    }

    var nav = $("days");
    WEEK.days.forEach(function (day, i) {
      var b = el("button", "day" + (i === state.today ? " today" : ""));
      b.type = "button";
      var parts = day.date.split("-");
      b.appendChild(el("b", null, day.weekday));
      b.appendChild(el("span", null, parseInt(parts[1], 10) + "/" + parseInt(parts[2], 10)));
      b.addEventListener("click", function () { state.day = i; draw(); });
      nav.appendChild(b);
    });

    nav.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
      move(e.key === "ArrowRight" ? 1 : -1);
      nav.children[state.day].focus();
      e.preventDefault();
    });

    /* 폰에서는 좌우 스와이프로 날짜 이동 */
    var x0 = null, y0 = null;
    document.addEventListener("touchstart", function (e) {
      x0 = e.touches[0].clientX;
      y0 = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener("touchend", function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      var dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.6) move(dx < 0 ? 1 : -1);
      x0 = null;
    }, { passive: true });

    function move(step) {
      state.day = (state.day + step + WEEK.days.length) % WEEK.days.length;
      draw();
    }

    draw();
    /* 배식 상태는 분 단위로만 바뀐다. 사용자가 탭을 직접 고른 뒤엔 건드리지 않는다 */
    setInterval(draw, 60000);
  }

  boot();
</script>

<script>
if ("serviceWorker" in navigator) {
  addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
}
</script>
</body>
