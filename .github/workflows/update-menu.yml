name: 식단 갱신

on:
  schedule:
    # 매주 토요일 07:30 KST (금요일 22:30 UTC)
    # 다음 주 표는 금요일까지 올라오므로 토요일에 받으면 월요일엔 이미 최신.
    # 분을 :00에서 비켜 GitHub Actions 큐 지연을 줄임.
    - cron: "30 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 최신 PDF 받아 페이지 생성
        run: python menu.py --site

      - name: 이번 주 식단 확인
        run: python menu.py --week

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "식단 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
